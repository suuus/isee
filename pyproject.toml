[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "isee-framework"
version = "0.1.0"
description = "Copilot and agentic integration for the ISEE Framework"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Suzanne Daniels" }]
keywords = ["agents", "copilot", "governance", "isee", "intent", "structure", "evidence"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13"
]
dependencies = []

[project.urls]
Homepage = "https://github.com/suuus/isee"
Repository = "https://github.com/suuus/isee"
Issues = "https://github.com/suuus/isee/issues"

[project.scripts]
isee = "isee.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/isee"]

[tool.pytest.ini_options]
testpaths = ["tests"]
